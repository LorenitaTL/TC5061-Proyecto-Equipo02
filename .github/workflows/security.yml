name: security

on:
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC: new vulnerabilities are published even when the code does not change
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Audits requirements.txt and requirements-validation.txt with pip-audit (make security-deps).
  # bandit runs as a pre-commit hook, so the pre-commit workflow already covers it.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit builds its own environment for each file, so it is the only thing to install
      - run: python -m pip install "$(grep '^pip-audit==' requirements.txt)"

      - run: make security-deps
