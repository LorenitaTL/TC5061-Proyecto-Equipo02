name: validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # DeepChecks needs older numpy, scikit-learn and pandas, so its tests run in their own environment
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements-validation.txt

      - name: Run DeepChecks tests
        run: |
          if [ -f tests/test_data_validation.py ]; then
            python -m pytest tests/test_data_validation.py
          else
            echo "tests/test_data_validation.py does not exist yet; skipping"
          fi
