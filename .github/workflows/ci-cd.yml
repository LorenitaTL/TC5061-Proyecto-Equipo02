name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Name of the image built by the image job, before it is tagged for GHCR
env:
  LOCAL_IMAGE: mibici-api:ci

jobs:
  # Runs the test suite with coverage on the three OSes the team uses
  ci-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: >
          python -m pytest tests
          --cov=mi_bici
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  # Builds the API image once the tests pass on every OS, with Buildx layers cached in
  # GitHub Actions (type=gha). The image travels to the next jobs as an artifact, so
  # compose tests and publish pushes exactly the same image. Read-only: it pushes nothing.
  image:
    needs: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Brings up the whole system (mlflow -> seed -> api) with the image just built and checks
  # that it serves predictions: smoke test of /health and POST /predict and a short Locust
  # run. The volume is deleted at the end so every run starts from the seed model.
  compose:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      # mlflow and seed use pull_policy: never, so the image must be local before `up`
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          echo "API_IMAGE=$LOCAL_IMAGE" >> "$GITHUB_ENV"

      # --wait returns once mlflow and api are healthy; the api healthcheck requires
      # model_loaded: true, so it fails if the seed model did not load
      - name: Start system
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test
        run: bash .github/scripts/smoke.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-load.txt
            requirements.txt

      # The locustfile imports mi_bici.operations.load_payloads, and mi_bici imports
      # config (python-dotenv, loguru); the full requirements.txt is not needed
      - name: Install load test dependencies
        run: |
          python -m pip install -r requirements-load.txt \
            "$(grep '^python-dotenv==' requirements.txt)" \
            "$(grep '^loguru==' requirements.txt)"

      - name: Locust headless (30 s)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ ! -f load_tests/locustfile.py ]; then
            echo "load_tests/locustfile.py does not exist; skipping"; exit 0
          fi
          mkdir -p reports/load_test/ci
          python -m locust -f load_tests/locustfile.py --headless --only-summary \
            -u 10 -r 2 -t 30s --host "$API_URL" --csv reports/load_test/ci/locust

      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-ci
          path: reports/load_test/ci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compose logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --timestamps --no-color

      - name: Stop system
        if: always()
        run: docker compose down -v

  # Publishes the image validated by compose to GHCR (Packages) as
  # ghcr.io/<owner>/<repo>/mibici-api:sha-<commit> and :latest. Only on push to main and
  # on workflow_dispatch; latest moves only from main, so a manual run on a PR branch
  # publishes its sha tag without replacing the image of main.
  publish:
    needs: compose
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      tags: ${{ steps.push.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "$RUNNER_TEMP/image.tar"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR only accepts lowercase names (contract: ghcr.io/lorenitatl/tc5061-proyecto-equipo02/mibici-api)
      - name: Tag and push
        id: push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/mibici-api"
          tags="sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags latest"; fi
          for tag in $tags; do
            docker tag "$LOCAL_IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done
          echo "image=$repo:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  # Deploys the published image the way a server would: pulls it from GHCR, starts the
  # system with API_IMAGE=<ghcr> and runs the same smoke test. The runner is discarded at
  # the end, so it ends with `down -v`.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.publish.outputs.image }}
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "$API_IMAGE"

      - name: Start system
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test
        run: bash .github/scripts/smoke.sh

      - name: Compose logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --timestamps --no-color

      - name: Stop system
        if: always()
        run: docker compose down -v

  # Always runs: writes the result and duration of every job and the image tag to the run
  # summary, and posts the same table on the PR. There is one comment per event type
  # (pull_request, workflow_dispatch, push), found by a hidden marker and edited on the next
  # run of that event, so a pull_request run never overwrites a workflow_dispatch result.
  # On pull_request the PR comes from the event; on push and workflow_dispatch, from the PR
  # associated with the commit.
  notify:
    needs: [ci-tests, image, compose, publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.publish.outputs.image }}
      IMAGE_TAGS: ${{ needs.publish.outputs.tags }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # On pull_request, GITHUB_SHA is the temporary merge commit; show the PR head instead
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Build summary
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## ci-cd · ${HEAD_SHA::7} · $GITHUB_EVENT_NAME"
            echo
            echo "| Job | Resultado | Duración |"
            echo "| :--- | :--- | ---: |"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --paginate --jq '.jobs[] | select(.name != "notify") | [.name, (.conclusion // .status), .started_at, .completed_at] | @tsv' |
            while IFS=$'\t' read -r name result started completed; do
              case "$result" in
                success) label="✅ success" ;; failure) label="❌ failure" ;; cancelled) label="⛔ cancelled" ;; *) label="• $result" ;;
              esac
              # publish and deploy are skipped on purpose outside push to main and workflow_dispatch;
              # any other skip means an earlier job failed
              if [ "$result" = "skipped" ]; then
                if { [ "$name" = "publish" ] || [ "$name" = "deploy" ]; } && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                  label="⏭️ omitido (solo en push a main o workflow_dispatch)"
                else
                  label="⏭️ omitido (falló un job previo)"
                fi
              fi
              if [ "$result" = "skipped" ] || [ -z "$completed" ] || [ "$completed" = "null" ]; then
                duration="—"
              else
                s=$(( $(date -d "$completed" +%s) - $(date -d "$started" +%s) ))
                duration="$((s / 60))m $((s % 60))s"
              fi
              echo "| \`$name\` | $label | $duration |"
            done
            echo
            if [ -n "$IMAGE" ]; then
              tag_list=""
              for t in $IMAGE_TAGS; do tag_list+="${tag_list:+, }\`$t\`"; done
              echo "**Imagen:** \`$IMAGE\` (etiquetas: $tag_list)"
            else
              echo "**Imagen:** no publicada en esta corrida (publish solo corre en push a main y workflow_dispatch)."
            fi
            created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)"
            total=$(( $(date +%s) - $(date -d "$created" +%s) ))
            echo
            echo "**Tiempo total:** $((total / 60))m $((total % 60))s · [Ver corrida]($run_url)"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md

      - name: Comment on PR
        if: env.FORK_PR != 'true'
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')"
          fi
          if [ -z "$pr" ]; then
            echo "No PR is associated with $GITHUB_SHA; skipping the comment"; exit 0
          fi
          marker="<!-- ci-cd:$GITHUB_EVENT_NAME -->"
          { echo "$marker"; echo; cat summary.md; } > comment.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | tail -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "Updated comment $id on PR #$pr"
          else
            gh pr comment "$pr" --body-file comment.md
          fi
