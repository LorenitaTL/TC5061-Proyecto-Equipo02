name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the test suite with coverage on the three OSes the team uses
  ci-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: >
          python -m pytest tests
          --cov=mi_bici
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  # Builds the API image only after the tests pass on every OS.
  # The image is not pushed to a registry; Buildx layers are cached in GitHub Actions (type=gha).
  image:
    needs: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          tags: mibici-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
